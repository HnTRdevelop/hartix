################
### MONITORS ###
################

monitorv2 {
	output = DP-1
	mode = 2560x1440@144
 	position = 0x0
	scale = 1
	transform = 0
	bitdepth = 10
	supports_wide_color = 1
	supports_hdr = 1
}

monitor=virtual,1600x900@30,-1600x540,1
monitor=eDP-1,1600x900@60,0x0,1
monitor=phone,1170x2532@30,-390x-304,3

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nemo
$browser = firefox


###################
### ENVIRONMENT ###
###################

env=XDG_CURRENT_DESKTOP,Hyprland
env=XDG_SESSION_DESKTOP,Hyprland
env=HYPRCURSOR_SIZE,24
env=HYPRCURSOR_THEME,"Capitaine Cursors (Gruvbox)"
env=HYPRSHOT_DIR,"$HOME/Pictures/Screenshots"


#################
### AUTOSTART ###
#################

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dunst
exec-once = hyprpaper
exec-once = waybar
exec-once = copyq
# exec-once = mpvpaper ALL ~/.local/share/wallpapers/coolvideos/ -o "--no-audio --loop-playlist --shuffle" & 
# exec-once = betterbird
exec-once = hypridle
exec-once = gsr-ui
exec-once = qpwgraph -m
exec-once = v2rayn
exec-once = easyeffects
exec-once = hyprlock

exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Colloid-Yellow-Dark-Compact-Gruvbox"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"


#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 6
    gaps_out = 12

    border_size = 6

    col.active_border = rgb(FABD2F)
    col.inactive_border = rgb(1D2021)

    resize_on_border = false 

    allow_tearing = true

    layout = dwindle
    resize_on_border = true
	extend_border_grab_area = 12
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

animations {
    enabled = false

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    vrr = 2
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    middle_click_paste = false
    enable_anr_dialog=false
}

render {
	cm_fs_passthrough = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us, ru
    kb_variant = 
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = false
        disable_while_typing = false
        scroll_factor = 0.5
        drag_lock = true
        clickfinger_behavior = true
    }

    numlock_by_default = true
}

gestures {
}

plugin {
    hyprbars {
        bar_height = 24
        bar_text_font = HackNerdFontPropo
        bar_text_size = 10
        bar_text_align = left
        bar_part_of_window = false
        bar_color = rgb(FABD2F)
        col.text = rgb(EBDBB2)

        hyprbars-button = rgb(1D2021), 20, 󱎘, hyprctl dispatch killactive, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 󰖯, hyprctl dispatch fullscreen 1, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 󰖰, hyprctl dispatch togglefloating, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 󰐃, hyprctl dispatch pin true, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, , hyprctl dispatch centerwindow, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, S, hyprctl dispatch movetoworkspacesilent special:special, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 9, hyprctl dispatch movetoworkspacesilent 9, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 8, hyprctl dispatch movetoworkspacesilent 8, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 7, hyprctl dispatch movetoworkspacesilent 7, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 6, hyprctl dispatch movetoworkspacesilent 6, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 5, hyprctl dispatch movetoworkspacesilent 5, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 4, hyprctl dispatch movetoworkspacesilent 4, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 3, hyprctl dispatch movetoworkspacesilent 3, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 2, hyprctl dispatch movetoworkspacesilent 2, rgb(EBDBB2)
        hyprbars-button = rgb(1D2021), 20, 1, hyprctl dispatch movetoworkspacesilent 1, rgb(EBDBB2)
    }
}


####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER # Sets "Windows" key as main modifier
$shift = shift
$alt = alt
$ctrl = ctrl

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod $ctrl, Q, exec, loginctl terminate-session "$(loginctl | awk '/tty1/ {print $1}')"
# bind = $mainMod $ctrl, Q, exec, uwsm stop
bind = $mainMod $ctrl, Q, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 2
bind = $mainMod $shift, F, fullscreen, 1
bind = $mainMod $ctrl, F, exec, hyprctl dispatch setfloating; hyprctl dispatch resizeactive exact 2560 1440; hyprctl dispatch centerwindow
bind = $mainMod, D, exec, /home/hntr/.config/rofi/launcher/launcher.sh full
bind = $mainMod $shift, D, exec, /home/hntr/.config/rofi/launcher/launcher-proxy.sh full
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod, K, exec, gnome-calculator
bind = $mainMod $shift, P, exec, hyprctl dispatch pin activefocus
bind = $mainMod, P, exec, pavucontrol
bind = $mainMod, G, exec, gedit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod $shift, R, exec, gsr-ui-cli replay-save
bind = $mainMod $ctrl, R, exec, gsr-ui-cli toggle-replay
bind = $mainMod, R, exec, gsr-ui-cli toggle-show
bind = $ctrl $shift, Escape, exec, $terminal htop
bind = $mainMod, A, exec, emote

bind = $ctrl $alt, Delete, exec, systemctl reboot

# Window manipulations
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod $shift, left, movewindow, l
bind = $mainMod $shift, right, movewindow, r
bind = $mainMod $shift, up, movewindow, u
bind = $mainMod $shift, down, movewindow, d

binde = $mainMod $ctrl, left, resizeactive, -25 0
binde = $mainMod $ctrl, right, resizeactive, 25 0
binde = $mainMod $ctrl, up, resizeactive, 0 -25
binde = $mainMod $ctrl, down, resizeactive, 0 25

bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,

bind = $mainMod, C, exec, hyprctl dispatch centerwindow

# Media buttons
binde = , XF86AudioRaiseVolume, exec, dunstify -h string:x-canonical-private-synchronous:audio "Volume: " -h int:value:"`ponymix increase 1`" -a " "
binde = , XF86AudioLowerVolume, exec, dunstify -h string:x-canonical-private-synchronous:audio "Volume: " -h int:value:"`ponymix decrease 1`" -a " "
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen brightness buttons
bind = , XF86MonBrightnessUp, exec, brightnessctl set 2%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

# Screenshots
bind = , Print, exec, hyprshot --mode region --freeze
bind = $ctrl, Print, exec, hyprshot --mode output --mode DP-1 --freeze
bind = $shift, Print, exec, hyprshot --mode window --freeze
bind = $mainMod $shift, C, exec, hyprpicker -a

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, m, workspace, 10
bind = $mainMod, 0, workspace, 11

bind = $mainMod $shift, 1, movetoworkspacesilent, 1
bind = $mainMod $shift, 2, movetoworkspacesilent, 2
bind = $mainMod $shift, 3, movetoworkspacesilent, 3
bind = $mainMod $shift, 4, movetoworkspacesilent, 4
bind = $mainMod $shift, 5, movetoworkspacesilent, 5
bind = $mainMod $shift, 6, movetoworkspacesilent, 6
bind = $mainMod $shift, 7, movetoworkspacesilent, 7
bind = $mainMod $shift, 8, movetoworkspacesilent, 8
bind = $mainMod $shift, 9, movetoworkspacesilent, 9
bind = $mainMod $shift, m, movetoworkspacesilent, 10
bind = $mainMod $shift, 0, movetoworkspacesilent, 11

bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod $shift, S, movetoworkspacesilent, special:special

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppress_event maximize, match:class .*

# Make workspaces 1-9 persistent
workspace = 1,  monitor:DP-1,    persistent:true
workspace = 2,  monitor:DP-1,    persistent:true
workspace = 3,  monitor:DP-1,    persistent:true
workspace = 4,  monitor:DP-1,    persistent:true
workspace = 5,  monitor:DP-1,    persistent:true
workspace = 6,  monitor:DP-1,    persistent:true
workspace = 7,  monitor:DP-1,    persistent:true
workspace = 8,  monitor:DP-1,    persistent:true
workspace = 9,  monitor:DP-1,    persistent:true
# workspace = 10, monitor:DP-1,    persistent:true
workspace = 11, monitor:virtual, persistent:true

# # Make some windows float + resize them
windowrule = float true, match:class org.kde.dolphin
windowrule = size 1280 800, match:class org.kde.dolphin
windowrule = float true, match:class org.gnome.Nautilus
windowrule = size 1280 800, match:class org.gnome.Nautilus
windowrule = float true, match:class nemo
windowrule = size 1280 800, match:class nemo
windowrule = float true, match:class org.gnome.Calculator
windowrule = size 360 616, match:class org.gnome.Calculator
windowrule = suppress_event fullscreen, match:class org.telegram.desktop match:title Media viewer
windowrule = float true, match:class org.telegram.desktop match:title Media viewer
windowrule = float true, match:class org.pulseaudio.pavucontrol
windowrule = size 1280 800, match:class org.pulseaudio.pavucontrol
windowrule = float true, match:class com.github.hluk.copyq
windowrule = float true, match:class org.gnome.Calendar
windowrule = float true, match:class nekobox
windowrule = size 1280 800, match:class org.gnome.Calendar
windowrule = float true, match:class org.gnome.gedit
windowrule = size 1280 800, match:class org.gnome.gedit
windowrule = float true, match:class com.github.wwmm.easyeffects
windowrule = size 1280 800, match:class com.github.wwmm.easyeffects
windowrule = float true, match:class org.nomacs.ImageLounge
windowrule = size 1280 800, match:class org.nomacs.ImageLounge
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class steam
windowrule = tile true, match:title Steam
windowrule = float true, match:class org.qbittorrent.qBittorrent
windowrule = tile true, match:title .*qBittorrent.*
windowrule = workspace 10 silent, match:class eu.betterbird.Betterbird
windowrule = float true, match:class gamescope
windowrule = float true, match:class zenity
windowrule = float true, match:title  Picture-in-Picture
windowrule = size 560 315, match:title Picture-in-Picture
windowrule = pin true, match:title Picture-in-Picture
windowrule = move 2000 1125, match:title Picture-in-Picture
windowrule = float true, match:class com.network.manager
windowrule = size 360 616, match:class com.network.manager
windowrule = float true, match:class org.gnome.FileRoller
windowrule = float true, match:class lmms
windowrule = float true, match:class xdg-desktop-portal-gtk
# windowrule = float true, match:class Godot
# windowrule = float true, match:title Godot
# windowrule = plugin:hyprbars:nobar, match:title .*\(DEBUG\)
# windowrule = tile true, match:class Godot, match:title Godot
windowrule = float true, match:class qemu
windowrule = float true, match:title .*on QEMU.*
windowrule = size 1920 1142, match:title .*on QEMU.*
windowrule = float true, match:class python3
windowrule = size 1280 800, match:class python3
windowrule = suppress_event fullscreen, match:title gsr ui
windowrule = size 2560 1440, match:title gsr ui
windowrule = pin true, match:title gsr ui
windowrule = stay_focused true, match:title  gsr ui
windowrule = size 512 128, match:class org.gnome.FileRoller
windowrule = float true, match:class dev.dadoum.Sideloader
windowrule = stay_focused true, match:class emote
windowrule = float true, match:class LosslessCut
windowrule = size 1920 1080, match:class LosslessCut
windowrule = move 2277 1370, match:title ^(notificationtoasts_.*_desktop)&
windowrule = float true, match:title ^(.*Silk.NET.*)$
windowrule = size 1280 720, match:title ^(.*Silk.NET.*)$
windowrule = border_size 0, match:class gamescope
windowrule = no_initial_focus true, match:class FreeCAD
windowrule = no_initial_focus true, match:class steam_app_255710
windowrule = no_initial_focus true, match:class fl64.exe
windowrule = no_initial_focus true, match:class OCCT
windowrule = no_initial_focus true, match:class tanki.exe

# XWayland Screen Share
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim true, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus true, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur true, match:class ^(xwaylandvideobridge)$
windowrule = no_focus true, match:class ^(xwaylandvideobridge)$
